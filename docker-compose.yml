services:

  # ==========================================================
  # PostgreSQL + pgvector
  # ==========================================================

  postgres:
    image: pgvector/pgvector:pg18

    container_name: research-agent-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-research_agent}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: research-agent-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # FastAPI
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: research-agent-backend

    restart: unless-stopped

    env_file:
      - backend/.env

    environment:

      # ------------------------------------------------------
      # Docker 内部不能使用 localhost 访问 postgres / redis。
      #
      # 服务名就是 Docker DNS：
      # postgres
      # redis
      # ------------------------------------------------------

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 15s
      timeout: 5s
      retries: 5


  # ==========================================================
  # Celery Worker
  # ==========================================================

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: research-agent-worker

    restart: unless-stopped

    env_file:
      - backend/.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "backend.app.worker.celery_app",
        "worker",
        "--loglevel=INFO"
      ]


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  postgres_data:

  redis_data: